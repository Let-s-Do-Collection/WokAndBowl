plugins {
    id "com.github.johnrengelman.shadow" version "8.0.0"
    id "com.modrinth.minotaur" version "2.+"
    id "net.darkhax.curseforgegradle" version "1.1.25"
}

def changelogText = rootProject.file("CHANGELOG.md").exists() ? rootProject.file("CHANGELOG.md").text : " "

architectury {
    platformSetupLoomIde()
    fabric()
}

def jarFileName = 'letsdo-wok_and_bowl-fabric'

base {
    archivesName = jarFileName
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation("net.satisfy.foundation:foundation-fabric:${rootProject.foundation_version}") { transitive = false }
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    modApi("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_fabric_version}")
    modImplementation "com.terraformersmc:modmenu:${rootProject.modmenu_version}"

    modImplementation(files(rootProject.file("local-mods/letsdo-farm_and_charm-fabric-${rootProject.farm_and_charm_version}.jar")))

    modImplementation("me.shedaniel:RoughlyEnoughItems-fabric:${rootProject.rei_version}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    modCompileOnlyApi("mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}")
    modCompileOnlyApi("mezz.jei:jei-${rootProject.minecraft_version}-fabric-api:${rootProject.jei_version}")
    modCompileOnly("dev.emi:emi-fabric:${rootProject.emi_version}:api")
    modLocalRuntime("dev.emi:emi-fabric:${rootProject.emi_version}")
    modRuntimeOnly("mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}")

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    repositories {
    }
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "lets-do-wok-bowl"
    versionNumber = rootProject.mod_version
    versionName = "${rootProject.archives_base_name}-${rootProject.mod_version} [${rootProject.minecraft_version}-fabric]"
    versionType = "release"
    changelog = changelogText
    gameVersions = [rootProject.minecraft_version]
    loaders = ["fabric"]
    uploadFile = remapJar

    dependencies {
        required.project "lets-do-foundation"
        required.project "fabric-api"
        required.project "architectury-api"
        required.project "lets-do-farm-charm"
        required.project "cloth-config"
        optional.project "modmenu"
        optional.project "rei"
        optional.project "jei"
        optional.project "emi"
    }
}

tasks.register("curseforge1824446", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_API_KEY")
    disableVersionDetection()

    def mainFile = upload("1824446", remapJar)
    mainFile.releaseType = "release"
    mainFile.changelog = changelogText
    mainFile.changelogType = "markdown"
    mainFile.displayName = "Wok & Bowl - ${rootProject.mod_version} - FABRIC - ${rootProject.minecraft_version}"
    mainFile.addGameVersion(rootProject.minecraft_version)
    mainFile.addModLoader("Fabric")
    mainFile.addEnvironment("Client", "Server")
    mainFile.addRequirement("lets-do-foundation")
    mainFile.addRequirement("fabric-api")
    mainFile.addRequirement("architectury-api")
    mainFile.addRequirement("lets-do-farm-charm")
    mainFile.addRequirement("cloth-config")
    mainFile.addOptional("modmenu")
    mainFile.addOptional("roughly-enough-items")
    mainFile.addOptional("jei")
    mainFile.addOptional("emi")
}
